<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맞춤 식단 추천</title>
<style>
:root {
  --bg: #111409;
  --surface: #1c2114;
  --surface2: #242c1a;
  --surface3: #2e3720;
  --border: #3e4d28;
  --accent: #7d9448;
  --accent2: #aab96a;
  --green: #6b9e4a;
  --red: #c47a50;
  --yellow: #c8a84a;
  --blue: #7a9e8a;
  --text: #e8d8b0;
  --muted: #8a8a68;
  --protein: #c47a50;
  --carb: #7a9e8a;
  --fat: #c8a84a;
  --m0: #aab96a;
  --m1: #6b9e4a;
  --m2: #c8a84a;
  --m3: #c47a50;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', -apple-system, sans-serif; min-height: 100vh; padding-bottom: 40px; }

.top-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,15,19,0.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-title {
  font-size: 1rem; font-weight: 800;
  background: linear-gradient(135deg, #d4c87a, #7d9448);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
.card-title { font-size: 0.72rem; font-weight: 600; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }

/* Input section */
.input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.field input, .field select {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 0.9rem; padding: 9px 12px; outline: none; transition: border-color 0.2s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field select option { background: var(--surface2); }

.goal-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.goal-chip {
  flex: 1; min-width: 80px;
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: 10px; color: var(--muted); cursor: pointer;
  font-size: 0.8rem; font-weight: 600; padding: 8px 6px; text-align: center; transition: all 0.15s;
}
.goal-chip.active-cut { border-color: var(--red); color: var(--red); background: rgba(248,113,113,0.08); }
.goal-chip.active-main { border-color: var(--green); color: var(--green); background: rgba(52,211,153,0.08); }
.goal-chip.active-bulk { border-color: var(--yellow); color: var(--yellow); background: rgba(251,191,36,0.08); }

.gen-btn {
  width: 100%; background: linear-gradient(135deg, #7d9448, #4a5c28);
  border: none; border-radius: 12px; color: #fff; cursor: pointer;
  font-size: 1rem; font-weight: 700; padding: 14px; transition: opacity 0.2s, transform 0.1s;
}
.gen-btn:hover { opacity: 0.9; }
.gen-btn:active { transform: scale(0.98); }
.gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Summary bar */
.summary-bar {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
}
.sb-chip {
  flex: 1; min-width: 70px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 8px; text-align: center;
}
.sb-val { font-size: 1.1rem; font-weight: 800; }
.sb-label { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

/* Meal card */
.meal-section { margin-bottom: 12px; }
.meal-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.meal-icon { font-size: 1.4rem; }
.meal-name { font-size: 0.95rem; font-weight: 700; }
.meal-kcal-tag {
  margin-left: auto; font-size: 0.78rem; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
}

.food-item {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.fi-left { flex: 1; min-width: 0; }
.fi-name { font-size: 0.9rem; font-weight: 600; }
.fi-amount { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.fi-macros {
  display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap;
}
.fi-macro { font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
.fi-macro.p { background: rgba(248,113,113,0.12); color: var(--protein); }
.fi-macro.c { background: rgba(96,165,250,0.12); color: var(--carb); }
.fi-macro.f { background: rgba(251,191,36,0.12); color: var(--fat); }
.fi-kcal { font-size: 1rem; font-weight: 800; color: var(--accent2); flex-shrink: 0; margin-left: 10px; }

/* Day total */
.day-total {
  background: linear-gradient(135deg, rgba(124,106,247,0.1), rgba(124,106,247,0.05));
  border: 1px solid rgba(124,106,247,0.3); border-radius: 14px;
  padding: 14px; margin-top: 4px;
}
.dt-title { font-size: 0.75rem; color: var(--accent2); font-weight: 600; margin-bottom: 10px; }
.dt-row { display: flex; gap: 6px; }
.dt-chip { flex: 1; text-align: center; }
.dt-val { font-size: 1rem; font-weight: 800; }
.dt-label { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

/* Macro progress */
.macro-prog { margin-top: 10px; }
.mp-row { margin-bottom: 6px; }
.mp-header { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 3px; }
.mp-track { height: 5px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.mp-fill { height: 100%; border-radius: 99px; }

/* Tip box */
.tip-box {
  background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.2);
  border-radius: 12px; padding: 12px 14px; margin-top: 10px;
  font-size: 0.8rem; color: var(--green); line-height: 1.5;
}
.tip-box strong { font-weight: 700; }

/* Regen btn */
.regen-btn {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; color: var(--text); cursor: pointer;
  font-size: 0.87rem; font-weight: 600; padding: 11px; margin-top: 4px;
  transition: all 0.15s;
}
.regen-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 10px; }

/* Meal color tags */
.tag-0 { background: rgba(167,139,250,0.15); color: var(--m0); }
.tag-1 { background: rgba(52,211,153,0.15); color: var(--m1); }
.tag-2 { background: rgba(251,146,60,0.15); color: var(--m2); }
.tag-3 { background: rgba(244,114,182,0.15); color: var(--m3); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
</style>
</head>
<body>

<div class="top-nav">
  <div class="nav-title">🥗 맞춤 식단 추천</div>
</div>

<div class="container">

  <!-- 목표 설정 -->
  <div class="card">
    <div class="card-title">목표 설정</div>

    <div class="goal-chips" id="goal-chips">
      <div class="goal-chip" data-goal="cut" onclick="selectGoal('cut')">🔥 다이어트</div>
      <div class="goal-chip" data-goal="main" onclick="selectGoal('main')">⚖️ 체중 유지</div>
      <div class="goal-chip" data-goal="bulk" onclick="selectGoal('bulk')">💪 근육 증량</div>
    </div>

    <div class="input-grid">
      <div class="field">
        <label>목표 칼로리 (kcal)</label>
        <input type="number" id="target-kcal" placeholder="예: 1800" min="800" max="5000">
      </div>
      <div class="field">
        <label>체중 (kg)</label>
        <input type="number" id="body-weight" placeholder="예: 65" min="30" max="200">
      </div>
      <div class="field">
        <label>단백질 목표 (%)</label>
        <input type="number" id="p-pct" placeholder="30" min="10" max="60" value="35">
      </div>
      <div class="field">
        <label>식사 횟수</label>
        <select id="meal-count">
          <option value="2">2끼 (점심/저녁)</option>
          <option value="3">3끼 (아침/점심/저녁)</option>
          <option value="4">4끼 (+간식)</option>
        </select>
      </div>
    </div>

    <button class="gen-btn" onclick="generate()">✨ 식단 추천받기</button>
  </div>

  <!-- 결과 -->
  <div id="result"></div>

</div>

<script>
// ══════════════════════════════════════════════
// Food Database by meal type
// ══════════════════════════════════════════════
const DB = {
  breakfast: [
    // 한식
    {n:'현미밥 + 된장찌개', kcal:280, p:14, c:46, f:5, note:'간편 한식 아침'},
    {n:'잡곡밥 + 계란후라이 2개', kcal:340, p:18, c:44, f:12, note:'든든한 아침'},
    {n:'계란 스크램블(3개) + 토스트', kcal:320, p:22, c:28, f:14, note:'고단백 간편식'},
    {n:'그릭요거트 + 바나나 + 아몬드', kcal:280, p:16, c:34, f:9, note:'간편 고단백'},
    {n:'오트밀 + 계란흰자 3개', kcal:260, p:24, c:30, f:4, note:'클린 다이어트'},
    {n:'닭가슴살 샌드위치', kcal:310, p:28, c:30, f:8, note:'고단백 간편식'},
    {n:'고구마 + 계란 2개 + 우유', kcal:300, p:18, c:38, f:8, note:'다이어트 클래식'},
    {n:'프로틴 쉐이크 + 바나나', kcal:290, p:30, c:34, f:4, note:'빠른 아침'},
    {n:'삶은 계란 2개 + 고구마 200g', kcal:280, p:16, c:40, f:8, note:'헬스 식단'},
    {n:'현미밥 + 미역국 + 구운 두부', kcal:300, p:16, c:44, f:7, note:'담백한 아침'},
  ],
  lunch: [
    {n:'닭가슴살 덮밥 (200g+밥)', kcal:420, p:38, c:48, f:6, note:'고단백 점심'},
    {n:'제육볶음 + 밥 + 나물', kcal:520, p:28, c:60, f:16, note:'든든한 한식'},
    {n:'참치김밥 1줄 + 된장국', kcal:400, p:18, c:56, f:10, note:'간편 점심'},
    {n:'비빔밥 (고기 추가)', kcal:550, p:24, c:72, f:14, note:'균형 잡힌 한식'},
    {n:'닭가슴살 샐러드 + 현미밥', kcal:380, p:34, c:38, f:8, note:'다이어트 점심'},
    {n:'연어 포케볼', kcal:450, p:28, c:44, f:16, note:'트렌디 고단백'},
    {n:'삼각김밥 2개 + 닭가슴살 캔', kcal:410, p:30, c:54, f:6, note:'편의점 고단백'},
    {n:'불고기 + 밥 + 나물 2가지', kcal:500, p:26, c:62, f:14, note:'균형 한식'},
    {n:'두부 된장찌개 + 현미밥', kcal:360, p:18, c:52, f:8, note:'저칼로리 한식'},
    {n:'닭가슴살 볶음밥', kcal:440, p:32, c:50, f:10, note:'고단백 볶음밥'},
    {n:'순두부찌개 + 밥', kcal:420, p:22, c:58, f:10, note:'담백한 점심'},
    {n:'오므라이스 (닭가슴살)', kcal:460, p:28, c:52, f:14, note:'간편 고단백'},
  ],
  dinner: [
    {n:'닭가슴살 구이 + 샐러드 + 고구마', kcal:380, p:40, c:32, f:7, note:'다이어트 저녁'},
    {n:'연어 구이 + 현미밥 + 브로콜리', kcal:440, p:34, c:38, f:14, note:'오메가3 저녁'},
    {n:'소고기 등심 150g + 쌈채소', kcal:380, p:36, c:8, f:22, note:'고단백 저칼로리'},
    {n:'닭가슴살 샐러드 (드레싱 없이)', kcal:280, p:38, c:12, f:6, note:'다이어트 저녁'},
    {n:'두부 스테이크 + 현미밥', kcal:340, p:22, c:42, f:9, note:'저칼로리 저녁'},
    {n:'새우 볶음 + 야채 + 현미밥', kcal:380, p:28, c:46, f:7, note:'저지방 저녁'},
    {n:'제육볶음 + 쌈채소 (밥 반공기)', kcal:420, p:30, c:36, f:16, note:'절제한 저녁'},
    {n:'계란찜 + 현미밥 + 김치', kcal:320, p:20, c:44, f:8, note:'간편 저녁'},
    {n:'고등어 구이 + 밥 + 나물', kcal:440, p:28, c:48, f:14, note:'오메가3 풍부'},
    {n:'닭가슴살 된장찌개 + 밥', kcal:380, p:32, c:46, f:7, note:'고단백 한식'},
    {n:'삼겹살 120g + 쌈채소 (밥 없이)', kcal:420, p:22, c:10, f:36, note:'저탄고지 저녁'},
    {n:'참치 계란볶음밥', kcal:400, p:28, c:46, f:12, note:'간편 고단백'},
  ],
  snack: [
    {n:'닭가슴살 소시지 2개', kcal:160, p:22, c:4, f:6, note:'고단백 간식'},
    {n:'그릭요거트 150g', kcal:90, p:15, c:5, f:1, note:'저칼로리 단백질'},
    {n:'삶은 계란 2개', kcal:155, p:13, c:1, f:10, note:'완전식품'},
    {n:'아몬드 30g', kcal:174, p:6, c:6, f:15, note:'건강한 지방'},
    {n:'프로틴바 1개', kcal:180, p:20, c:18, f:5, note:'운동 후 간식'},
    {n:'바나나 1개', kcal:89, p:1, c:23, f:0, note:'운동 전 에너지'},
    {n:'사과 1개 + 땅콩버터', kcal:180, p:5, c:24, f:8, note:'포만감 간식'},
    {n:'닭가슴살 캔 + 크래커', kcal:190, p:22, c:14, f:5, note:'고단백 간편'},
    {n:'두유 200ml', kcal:90, p:6, c:10, f:3, note:'식물성 단백질'},
    {n:'고구마 150g', kcal:135, p:3, c:31, f:0, note:'복합탄수 간식'},
  ]
};

let selectedGoal = 'cut';

function selectGoal(g) {
  selectedGoal = g;
  document.querySelectorAll('.goal-chip').forEach(c => {
    c.className = 'goal-chip';
    if (c.dataset.goal === g) c.classList.add(`active-${g}`);
  });
  // Auto-set protein pct by goal
  const pcts = {cut: 40, main: 30, bulk: 25};
  document.getElementById('p-pct').value = pcts[g];
}

function getCalDist(total, mealCount) {
  if (mealCount === 2) return [0.48, 0.52];
  if (mealCount === 3) return [0.25, 0.40, 0.35];
  return [0.20, 0.35, 0.30, 0.15];
}

function pickFood(arr, targetKcal, usedIdx) {
  // Find foods close to target kcal, not already used
  const available = arr.map((f,i) => ({...f, i})).filter(f => !usedIdx.has(f.i));
  if (available.length === 0) return {...arr[Math.floor(Math.random()*arr.length)], i:0};
  // Score by proximity to target
  available.sort((a,b) => Math.abs(a.kcal - targetKcal) - Math.abs(b.kcal - targetKcal));
  // Pick from top 4 randomly for variety
  const pool = available.slice(0, Math.min(4, available.length));
  const pick = pool[Math.floor(Math.random() * pool.length)];
  usedIdx.add(pick.i);
  return pick;
}

function scaleTo(food, targetKcal) {
  const ratio = targetKcal / food.kcal;
  // Only scale within ±30% to keep amounts realistic
  const clampedRatio = Math.max(0.7, Math.min(1.3, ratio));
  return {
    n: food.n,
    note: food.note,
    kcal: Math.round(food.kcal * clampedRatio),
    p: parseFloat((food.p * clampedRatio).toFixed(1)),
    c: parseFloat((food.c * clampedRatio).toFixed(1)),
    f: parseFloat((food.f * clampedRatio).toFixed(1)),
    scaled: Math.abs(clampedRatio - 1) > 0.05
  };
}

function generate() {
  const kcal = parseInt(document.getElementById('target-kcal').value);
  const weight = parseInt(document.getElementById('body-weight').value);
  const pPct = parseInt(document.getElementById('p-pct').value) || 35;
  const mealCount = parseInt(document.getElementById('meal-count').value);

  if (!kcal) { alert('목표 칼로리를 입력해주세요!'); return; }

  const cPct = Math.round((100 - pPct) * 0.55);
  const fPct = 100 - pPct - cPct;

  const dist = getCalDist(kcal, mealCount);
  const mealKeys = mealCount === 2
    ? ['lunch','dinner']
    : mealCount === 3
    ? ['breakfast','lunch','dinner']
    : ['breakfast','lunch','dinner','snack'];
  const mealNames = {breakfast:'🌅 아침', lunch:'☀️ 점심', dinner:'🌙 저녁', snack:'🍎 간식'};
  const mealColors = ['tag-0','tag-1','tag-2','tag-3'];

  const usedIdx = {breakfast:new Set(), lunch:new Set(), dinner:new Set(), snack:new Set()};

  let meals = mealKeys.map((key, mi) => {
    const targetMealKcal = Math.round(kcal * dist[mi]);
    const food = pickFood(DB[key], targetMealKcal, usedIdx[key]);
    const scaled = scaleTo(food, targetMealKcal);
    return { ...scaled, key };
  });

  // Totals
  const totals = meals.reduce((a,b) => ({kcal:a.kcal+b.kcal, p:a.p+b.p, c:a.c+b.c, f:a.f+b.f}), {kcal:0,p:0,c:0,f:0});
  const goalP = Math.round(kcal * pPct / 100 / 4);
  const goalC = Math.round(kcal * cPct / 100 / 4);
  const goalF = Math.round(kcal * fPct / 100 / 9);

  // Tips
  const tips = [];
  if (weight) {
    const minProtein = Math.round(weight * (selectedGoal === 'bulk' ? 2.0 : 1.6));
    tips.push(`체중 ${weight}kg 기준 권장 단백질: <strong>${minProtein}g/일</strong> (체중×${selectedGoal==='bulk'?2.0:1.6})`);
  }
  if (selectedGoal === 'cut') tips.push('다이어트 중엔 단백질을 충분히 섭취해야 근손실을 막을 수 있어요.');
  if (selectedGoal === 'bulk') tips.push('증량 기간엔 탄수화물을 운동 전후로 나눠 섭취하면 효과적이에요.');
  tips.push('물은 하루 2L 이상 마시고, 식사 30분 전 물 한 잔이 포만감에 도움 돼요.');

  const html = `
    <!-- 요약 -->
    <div class="summary-bar">
      <div class="sb-chip">
        <div class="sb-val" style="color:var(--accent2)">${kcal}</div>
        <div class="sb-label">목표 kcal</div>
      </div>
      <div class="sb-chip">
        <div class="sb-val" style="color:var(--protein)">${goalP}g</div>
        <div class="sb-label">단백질 목표</div>
      </div>
      <div class="sb-chip">
        <div class="sb-val" style="color:var(--carb)">${goalC}g</div>
        <div class="sb-label">탄수 목표</div>
      </div>
      <div class="sb-chip">
        <div class="sb-val" style="color:var(--fat)">${goalF}g</div>
        <div class="sb-label">지방 목표</div>
      </div>
    </div>

    <!-- 끼니별 식단 -->
    <div class="card">
      <div class="card-title">오늘의 추천 식단</div>

      ${meals.map((m, mi) => `
        <div class="meal-section">
          <div class="meal-header">
            <div class="meal-name">${mealNames[m.key]}</div>
            <div class="meal-kcal-tag ${mealColors[mi]}">${m.kcal} kcal</div>
          </div>
          <div class="food-item">
            <div class="fi-left">
              <div class="fi-name">${m.n}</div>
              <div class="fi-amount">${m.note}</div>
              <div class="fi-macros">
                <div class="fi-macro p">단백 ${m.p}g</div>
                <div class="fi-macro c">탄수 ${m.c}g</div>
                <div class="fi-macro f">지방 ${m.f}g</div>
              </div>
            </div>
            <div class="fi-kcal">${m.kcal}</div>
          </div>
        </div>
      `).join('')}

      <!-- 하루 합계 -->
      <div class="day-total">
        <div class="dt-title">📊 하루 합계</div>
        <div class="dt-row">
          <div class="dt-chip">
            <div class="dt-val" style="color:var(--accent2)">${totals.kcal}</div>
            <div class="dt-label">kcal</div>
          </div>
          <div class="dt-chip">
            <div class="dt-val" style="color:var(--protein)">${totals.p.toFixed(0)}g</div>
            <div class="dt-label">단백질</div>
          </div>
          <div class="dt-chip">
            <div class="dt-val" style="color:var(--carb)">${totals.c.toFixed(0)}g</div>
            <div class="dt-label">탄수화물</div>
          </div>
          <div class="dt-chip">
            <div class="dt-val" style="color:var(--fat)">${totals.f.toFixed(0)}g</div>
            <div class="dt-label">지방</div>
          </div>
        </div>
        <div class="macro-prog">
          ${[
            {label:'단백질', cur:totals.p, goal:goalP, color:'var(--protein)'},
            {label:'탄수화물', cur:totals.c, goal:goalC, color:'var(--carb)'},
            {label:'지방', cur:totals.f, goal:goalF, color:'var(--fat)'},
          ].map(m => `
            <div class="mp-row">
              <div class="mp-header">
                <span style="font-size:0.75rem;color:var(--muted)">${m.label}</span>
                <span style="font-size:0.75rem">${m.cur.toFixed(0)}g / ${m.goal}g</span>
              </div>
              <div class="mp-track">
                <div class="mp-fill" style="width:${Math.min(m.cur/m.goal*100,100).toFixed(0)}%;background:${m.color}"></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <!-- 팁 -->
    <div class="card">
      <div class="card-title">💡 오늘의 식단 팁</div>
      ${tips.map(t => `<div class="tip-box">${t}</div>`).join('')}
    </div>

    <!-- 다시 추천 -->
    <button class="regen-btn" onclick="generate()">🔀 다른 식단으로 다시 추천</button>
  `;

  document.getElementById('result').innerHTML = html;
  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
}

// TDEE 계산기 연동 — localStorage에서 자동 불러오기
function loadFromTDEE() {
  const saved = localStorage.getItem('tdee-result');
  if (!saved) return;
  const d = JSON.parse(saved);
  document.getElementById('target-kcal').value = d.targetKcal || '';
  if (d.weight) document.getElementById('body-weight').value = d.weight;
  if (d.macros?.p) document.getElementById('p-pct').value = d.macros.p;
  if (d.goal) selectGoal(d.goal);
  // 안내 표시
  showTDEEBadge(d.targetKcal, d.tdee, d.goal);
}

function showTDEEBadge(targetKcal, tdee, goal) {
  const existing = document.getElementById('tdee-badge');
  if (existing) existing.remove();
  const goalLabel = {cut:'🔥 다이어트', main:'⚖️ 유지', bulk:'💪 증량'}[goal] || '';
  const badge = document.createElement('div');
  badge.id = 'tdee-badge';
  badge.style.cssText = 'background:rgba(124,106,247,0.1);border:1px solid rgba(124,106,247,0.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:0.8rem;color:var(--accent2)';
  badge.innerHTML = `✅ TDEE 계산기 연동됨 &nbsp;|&nbsp; TDEE <strong>${tdee} kcal</strong> &nbsp;→&nbsp; ${goalLabel} <strong>${targetKcal} kcal</strong>`;
  document.querySelector('.gen-btn').insertAdjacentElement('beforebegin', badge);
}

// 초기 목표 선택 후 TDEE 연동
selectGoal('cut');
loadFromTDEE();
</script>
</body>
</html>
