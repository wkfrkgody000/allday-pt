<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDEE 계산기</title>
<style>
  :root {
    --bg: #111409;
    --surface: #1c2114;
    --surface2: #242c1a;
    --border: #3e4d28;
    --accent: #7d9448;
    --accent2: #aab96a;
    --green: #6b9e4a;
    --red: #c47a50;
    --yellow: #c8a84a;
    --text: #e8d8b0;
    --muted: #8a8a68;
    --protein: #c47a50;
    --carb: #7a9e8a;
    --fat: #c8a84a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #d4c87a, #7d9448);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 28px;
  }
  .container { max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  input[type="number"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    padding: 10px 14px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="number"]:focus { border-color: var(--accent); }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }
  .seg-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .seg-btn {
    flex: 1;
    min-width: 60px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 9px 8px;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
    white-space: nowrap;
  }
  .seg-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .seg-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

  /* Goal pills */
  .goal-group { display: flex; gap: 8px; }
  .goal-btn {
    flex: 1;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    cursor: pointer;
    padding: 12px 6px;
    text-align: center;
    transition: all 0.18s;
  }
  .goal-btn .goal-icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
  .goal-btn .goal-label { font-size: 0.78rem; font-weight: 600; }
  .goal-btn .goal-desc { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .goal-btn.active-cut { border-color: var(--red); background: rgba(248,113,113,0.08); color: var(--red); }
  .goal-btn.active-cut .goal-desc { color: rgba(248,113,113,0.6); }
  .goal-btn.active-main { border-color: var(--green); background: rgba(52,211,153,0.08); color: var(--green); }
  .goal-btn.active-main .goal-desc { color: rgba(52,211,153,0.6); }
  .goal-btn.active-bulk { border-color: var(--yellow); background: rgba(251,191,36,0.08); color: var(--yellow); }
  .goal-btn.active-bulk .goal-desc { color: rgba(251,191,36,0.6); }

  /* Result section */
  .result-hidden { display: none; }
  .tdee-display {
    text-align: center;
    padding: 8px 0 20px;
  }
  .tdee-number {
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(135deg, #d4c87a, #7d9448);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .tdee-unit { font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
  .tdee-meta { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .meta-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.76rem;
    color: var(--muted);
  }
  .meta-chip span { color: var(--text); font-weight: 600; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* Macro bars */
  .macro-bar-row { margin-bottom: 16px; }
  .macro-bar-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .macro-name { font-size: 0.85rem; font-weight: 600; }
  .macro-name.protein { color: var(--protein); }
  .macro-name.carb { color: var(--carb); }
  .macro-name.fat { color: var(--fat); }
  .macro-val { font-size: 1rem; font-weight: 700; }
  .macro-pct { font-size: 0.78rem; color: var(--muted); margin-left: 4px; }
  .macro-kcal { font-size: 0.75rem; color: var(--muted); }
  .bar-track {
    height: 8px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }
  .bar-fill.protein { background: var(--protein); }
  .bar-fill.carb { background: var(--carb); }
  .bar-fill.fat { background: var(--fat); }

  /* Sliders */
  .slider-section { margin-top: 20px; }
  .slider-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.72rem;
    padding: 2px 8px;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .slider-row { margin-bottom: 14px; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 6px;
  }
  .slider-label-name { font-weight: 500; }
  .slider-label-val { font-weight: 700; color: var(--text); }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 99px;
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  input[type="range"].protein-range {
    background: linear-gradient(to right, var(--protein) var(--pct, 30%), var(--surface2) var(--pct, 30%));
  }
  input[type="range"].carb-range {
    background: linear-gradient(to right, var(--carb) var(--pct, 40%), var(--surface2) var(--pct, 40%));
  }
  input[type="range"].fat-range {
    background: linear-gradient(to right, var(--fat) var(--pct, 30%), var(--surface2) var(--pct, 30%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    cursor: pointer;
  }
  .total-check {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface2);
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: 6px;
  }
  .total-check-label { font-size: 0.8rem; color: var(--muted); }
  .total-pct {
    font-size: 0.95rem;
    font-weight: 700;
  }
  .total-pct.ok { color: var(--green); }
  .total-pct.warn { color: var(--red); }

  /* Calorie target row */
  .target-row {
    display: flex;
    gap: 8px;
    margin-bottom: 0;
  }
  .target-card {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .target-card .t-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
  .target-card .t-val { font-size: 1.2rem; font-weight: 700; }
  .target-card .t-val.cut { color: var(--red); }
  .target-card .t-val.main { color: var(--green); }
  .target-card .t-val.bulk { color: var(--yellow); }
  .target-card.active-target { border-color: var(--accent); background: rgba(124,106,247,0.08); }

  .calc-btn {
    width: 100%;
    background: linear-gradient(135deg, #7d9448, #4a5c28);
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    padding: 14px;
    margin-top: 4px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .calc-btn:hover { opacity: 0.9; }
  .calc-btn:active { transform: scale(0.98); }

  /* Donut */
  .donut-wrapper {
    display: flex;
    justify-content: center;
    margin: 16px 0 0;
  }
  .donut-container {
    position: relative;
    width: 140px;
    height: 140px;
  }
  #donut-svg { width: 140px; height: 140px; transform: rotate(-90deg); }
  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.4;
  }
  .donut-center strong {
    font-size: 1.25rem;
    color: var(--text);
    display: block;
  }

  @media (max-width: 400px) {
    .goal-btn .goal-icon { font-size: 1.2rem; }
    .tdee-number { font-size: 2.4rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>TDEE 계산기</h1>
  <p class="subtitle">나에게 맞는 칼로리 & 매크로를 계산해보세요</p>

  <!-- 기본 정보 -->
  <div class="card">
    <div class="card-title">신체 정보</div>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field">
        <label>나이</label>
        <input type="number" id="age" placeholder="25" min="10" max="100">
      </div>
      <div class="field">
        <label>성별</label>
        <div class="seg-group">
          <div class="seg-btn active" data-group="gender" data-val="male">남성</div>
          <div class="seg-btn" data-group="gender" data-val="female">여성</div>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>키 (cm)</label>
        <input type="number" id="height" placeholder="170" min="100" max="250">
      </div>
      <div class="field">
        <label>체중 (kg)</label>
        <input type="number" id="weight" placeholder="70" min="20" max="300">
      </div>
    </div>
  </div>

  <!-- 활동량 -->
  <div class="card">
    <div class="card-title">활동 수준</div>
    <div class="seg-group" id="activity-group">
      <div class="seg-btn active" data-group="activity" data-val="1.2">거의 없음</div>
      <div class="seg-btn" data-group="activity" data-val="1.375">가벼운 운동</div>
      <div class="seg-btn" data-group="activity" data-val="1.55">중간 운동</div>
      <div class="seg-btn" data-group="activity" data-val="1.725">격한 운동</div>
      <div class="seg-btn" data-group="activity" data-val="1.9">매우 격함</div>
    </div>
  </div>

  <!-- 목표 -->
  <div class="card">
    <div class="card-title">목표</div>
    <div class="goal-group">
      <div class="goal-btn" data-goal="cut">
        <span class="goal-icon">🔥</span>
        <div class="goal-label">감량</div>
        <div class="goal-desc">-500 kcal</div>
      </div>
      <div class="goal-btn" data-goal="main">
        <span class="goal-icon">⚖️</span>
        <div class="goal-label">유지</div>
        <div class="goal-desc">TDEE</div>
      </div>
      <div class="goal-btn" data-goal="bulk">
        <span class="goal-icon">💪</span>
        <div class="goal-label">증량</div>
        <div class="goal-desc">+500 kcal</div>
      </div>
    </div>
  </div>

  <button class="calc-btn" onclick="calculate()">계산하기</button>

  <!-- 결과 -->
  <div id="result" class="result-hidden">

    <!-- TDEE 결과 -->
    <div class="card" style="margin-top:16px">
      <div class="card-title">나의 TDEE</div>
      <div class="tdee-display">
        <div class="tdee-number" id="tdee-val">–</div>
        <div class="tdee-unit">kcal / 일</div>
        <div class="tdee-meta">
          <div class="meta-chip">BMR <span id="bmr-val">–</span> kcal</div>
          <div class="meta-chip">BMI <span id="bmi-val">–</span></div>
        </div>
      </div>

      <div class="divider"></div>
      <div class="target-row">
        <div class="target-card" id="tc-cut">
          <div class="t-label">🔥 감량</div>
          <div class="t-val cut" id="cut-val">–</div>
        </div>
        <div class="target-card" id="tc-main">
          <div class="t-label">⚖️ 유지</div>
          <div class="t-val main" id="main-val">–</div>
        </div>
        <div class="target-card" id="tc-bulk">
          <div class="t-label">💪 증량</div>
          <div class="t-val bulk" id="bulk-val">–</div>
        </div>
      </div>
    </div>

    <!-- 매크로 -->
    <div class="card">
      <div class="card-title">맞춤 매크로</div>

      <!-- Donut -->
      <div class="donut-wrapper">
        <div class="donut-container">
          <svg id="donut-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle id="d-fat" cx="50" cy="50" r="38" fill="none" stroke-width="14"/>
            <circle id="d-carb" cx="50" cy="50" r="38" fill="none" stroke-width="14"/>
            <circle id="d-protein" cx="50" cy="50" r="38" fill="none" stroke-width="14"/>
          </svg>
          <div class="donut-center">
            <strong id="donut-kcal">–</strong>
            <span>kcal/일</span>
          </div>
        </div>
      </div>

      <div style="height:16px"></div>

      <!-- Macro bars -->
      <div class="macro-bar-row">
        <div class="macro-bar-header">
          <span class="macro-name protein">단백질</span>
          <div>
            <span class="macro-val" id="p-g">–</span><span style="font-size:0.8rem;color:var(--muted)">g</span>
            <span class="macro-pct" id="p-pct"></span>
            <span class="macro-kcal" id="p-kcal"></span>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill protein" id="p-bar" style="width:0%"></div></div>
      </div>
      <div class="macro-bar-row">
        <div class="macro-bar-header">
          <span class="macro-name carb">탄수화물</span>
          <div>
            <span class="macro-val" id="c-g">–</span><span style="font-size:0.8rem;color:var(--muted)">g</span>
            <span class="macro-pct" id="c-pct"></span>
            <span class="macro-kcal" id="c-kcal"></span>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill carb" id="c-bar" style="width:0%"></div></div>
      </div>
      <div class="macro-bar-row">
        <div class="macro-bar-header">
          <span class="macro-name fat">지방</span>
          <div>
            <span class="macro-val" id="f-g">–</span><span style="font-size:0.8rem;color:var(--muted)">g</span>
            <span class="macro-pct" id="f-pct"></span>
            <span class="macro-kcal" id="f-kcal"></span>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill fat" id="f-bar" style="width:0%"></div></div>
      </div>

      <div class="divider"></div>

      <!-- Sliders -->
      <div class="slider-section">
        <div class="slider-title">
          비율 직접 조정
          <button class="reset-btn" onclick="resetMacros()">기본값으로</button>
        </div>

        <div class="slider-row">
          <div class="slider-label">
            <span class="slider-label-name" style="color:var(--protein)">단백질</span>
            <span class="slider-label-val"><span id="sp-val">30</span>%</span>
          </div>
          <input type="range" class="protein-range" id="sp" min="10" max="60" value="30"
            oninput="onSliderChange('sp', this.value)">
        </div>
        <div class="slider-row">
          <div class="slider-label">
            <span class="slider-label-name" style="color:var(--carb)">탄수화물</span>
            <span class="slider-label-val"><span id="sc-val">40</span>%</span>
          </div>
          <input type="range" class="carb-range" id="sc" min="10" max="70" value="40"
            oninput="onSliderChange('sc', this.value)">
        </div>
        <div class="slider-row">
          <div class="slider-label">
            <span class="slider-label-name" style="color:var(--fat)">지방</span>
            <span class="slider-label-val"><span id="sf-val">30</span>%</span>
          </div>
          <input type="range" class="fat-range" id="sf" min="10" max="60" value="30"
            oninput="onSliderChange('sf', this.value)">
        </div>

        <div class="total-check">
          <span class="total-check-label">합계</span>
          <span class="total-pct ok" id="total-pct">100%</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let state = {
  gender: 'male',
  activity: 1.2,
  goal: 'main',
  tdee: 0,
  targetKcal: 0,
  macros: { p: 30, c: 40, f: 30 }
};

const GOAL_OFFSETS = { cut: -500, main: 0, bulk: 500 };
const GOAL_MACROS = {
  cut:  { p: 35, c: 35, f: 30 },
  main: { p: 30, c: 40, f: 30 },
  bulk: { p: 25, c: 50, f: 25 }
};

// ── Segment buttons ────────────────────────────────────────
document.querySelectorAll('.seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    document.querySelectorAll(`.seg-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (group === 'gender') state.gender = btn.dataset.val;
    if (group === 'activity') state.activity = parseFloat(btn.dataset.val);
  });
});

document.querySelectorAll('.goal-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.goal-btn').forEach(b => {
      b.className = 'goal-btn';
    });
    const g = btn.dataset.goal;
    btn.classList.add(`active-${g}`);
    state.goal = g;
  });
});

// ── Calculate ──────────────────────────────────────────────
function calculate() {
  const age = parseFloat(document.getElementById('age').value);
  const height = parseFloat(document.getElementById('height').value);
  const weight = parseFloat(document.getElementById('weight').value);

  if (!age || !height || !weight) {
    alert('나이, 키, 체중을 모두 입력해주세요!');
    return;
  }

  // Mifflin-St Jeor BMR
  let bmr;
  if (state.gender === 'male') {
    bmr = 10 * weight + 6.25 * height - 5 * age + 5;
  } else {
    bmr = 10 * weight + 6.25 * height - 5 * age - 161;
  }

  const tdee = Math.round(bmr * state.activity);
  const target = tdee + GOAL_OFFSETS[state.goal];
  const bmi = (weight / ((height / 100) ** 2)).toFixed(1);

  state.tdee = tdee;
  state.targetKcal = target;
  state.macros = { ...GOAL_MACROS[state.goal] };

  // Update sliders to match goal defaults
  setSliders(state.macros.p, state.macros.c, state.macros.f);

  // Display
  document.getElementById('tdee-val').textContent = tdee.toLocaleString();
  document.getElementById('bmr-val').textContent = Math.round(bmr).toLocaleString();
  document.getElementById('bmi-val').textContent = bmi;
  document.getElementById('cut-val').textContent = (tdee - 500).toLocaleString();
  document.getElementById('main-val').textContent = tdee.toLocaleString();
  document.getElementById('bulk-val').textContent = (tdee + 500).toLocaleString();

  highlightTargetCard();
  updateMacroDisplay();

  // 식단 추천 앱과 연동
  localStorage.setItem('tdee-result', JSON.stringify({
    tdee,
    targetKcal: target,
    goal: state.goal,
    macros: state.macros,
    weight: weight
  }));

  document.getElementById('result').classList.remove('result-hidden');
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function highlightTargetCard() {
  ['cut','main','bulk'].forEach(g => {
    document.getElementById(`tc-${g}`).classList.toggle('active-target', g === state.goal);
  });
}

// ── Macro display ──────────────────────────────────────────
function updateMacroDisplay() {
  const kcal = state.targetKcal;
  const { p, c, f } = state.macros;

  const pKcal = Math.round(kcal * p / 100);
  const cKcal = Math.round(kcal * c / 100);
  const fKcal = Math.round(kcal * f / 100);

  const pG = Math.round(pKcal / 4);
  const cG = Math.round(cKcal / 4);
  const fG = Math.round(fKcal / 9);

  document.getElementById('p-g').textContent = pG;
  document.getElementById('c-g').textContent = cG;
  document.getElementById('f-g').textContent = fG;
  document.getElementById('p-pct').textContent = `(${p}%)`;
  document.getElementById('c-pct').textContent = `(${c}%)`;
  document.getElementById('f-pct').textContent = `(${f}%)`;
  document.getElementById('p-kcal').textContent = `${pKcal} kcal`;
  document.getElementById('c-kcal').textContent = `${cKcal} kcal`;
  document.getElementById('f-kcal').textContent = `${fKcal} kcal`;

  // Bars (relative to 60g max-ish visually, use pct of target kcal)
  document.getElementById('p-bar').style.width = `${Math.min(p * 2, 100)}%`;
  document.getElementById('c-bar').style.width = `${Math.min(c * 1.5, 100)}%`;
  document.getElementById('f-bar').style.width = `${Math.min(f * 2, 100)}%`;

  // Donut
  document.getElementById('donut-kcal').textContent = kcal.toLocaleString();
  updateDonut(p, c, f);
}

function updateDonut(p, c, f) {
  const r = 38;
  const circ = 2 * Math.PI * r;
  const pDash = (p / 100) * circ;
  const cDash = (c / 100) * circ;
  const fDash = (f / 100) * circ;

  const pOffset = 0;
  const cOffset = -pDash;
  const fOffset = -(pDash + cDash);

  const dp = document.getElementById('d-protein');
  const dc = document.getElementById('d-carb');
  const df = document.getElementById('d-fat');

  dp.setAttribute('stroke', '#f87171');
  dp.setAttribute('stroke-dasharray', `${pDash} ${circ - pDash}`);
  dp.setAttribute('stroke-dashoffset', pOffset);

  dc.setAttribute('stroke', '#60a5fa');
  dc.setAttribute('stroke-dasharray', `${cDash} ${circ - cDash}`);
  dc.setAttribute('stroke-dashoffset', cOffset);

  df.setAttribute('stroke', '#fbbf24');
  df.setAttribute('stroke-dasharray', `${fDash} ${circ - fDash}`);
  df.setAttribute('stroke-dashoffset', fOffset);
}

// ── Sliders ────────────────────────────────────────────────
function setSliders(p, c, f) {
  const sp = document.getElementById('sp');
  const sc = document.getElementById('sc');
  const sf = document.getElementById('sf');
  sp.value = p; sc.value = c; sf.value = f;
  document.getElementById('sp-val').textContent = p;
  document.getElementById('sc-val').textContent = c;
  document.getElementById('sf-val').textContent = f;
  updateSliderStyle(sp, 'protein-range');
  updateSliderStyle(sc, 'carb-range');
  updateSliderStyle(sf, 'fat-range');
  updateTotalPct(p + c + f);
}

function onSliderChange(id, val) {
  val = parseInt(val);
  document.getElementById(`${id}-val`).textContent = val;
  const slider = document.getElementById(id);
  const className = id === 'sp' ? 'protein-range' : id === 'sc' ? 'carb-range' : 'fat-range';
  updateSliderStyle(slider, className);

  const p = parseInt(document.getElementById('sp').value);
  const c = parseInt(document.getElementById('sc').value);
  const f = parseInt(document.getElementById('sf').value);
  const total = p + c + f;
  updateTotalPct(total);

  if (total === 100) {
    state.macros = { p, c, f };
    updateMacroDisplay();
  }
}

function updateSliderStyle(el, cls) {
  const min = parseFloat(el.min);
  const max = parseFloat(el.max);
  const val = parseFloat(el.value);
  const pct = ((val - min) / (max - min) * 100).toFixed(1);
  el.style.setProperty('--pct', `${pct}%`);
}

function updateTotalPct(total) {
  const el = document.getElementById('total-pct');
  el.textContent = `${total}%`;
  el.className = 'total-pct ' + (total === 100 ? 'ok' : 'warn');
}

function resetMacros() {
  const m = GOAL_MACROS[state.goal] || { p: 30, c: 40, f: 30 };
  state.macros = { ...m };
  setSliders(m.p, m.c, m.f);
  updateMacroDisplay();
}
</script>
