<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 트래커</title>
<style>
:root {
  --bg: #111409;
  --surface: #1c2114;
  --surface2: #242c1a;
  --surface3: #2e3720;
  --border: #3e4d28;
  --accent: #7d9448;
  --accent2: #aab96a;
  --green: #6b9e4a;
  --red: #c47a50;
  --yellow: #c8a84a;
  --blue: #7a9e8a;
  --text: #e8d8b0;
  --muted: #8a8a68;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', -apple-system, sans-serif; min-height: 100vh; padding-bottom: 80px; }

/* Nav */
.top-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,18,9,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-title {
  font-size: 1rem; font-weight: 700;
  background: linear-gradient(135deg, #d4c87a, #7d9448);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.date-nav { display: flex; align-items: center; gap: 8px; }
.date-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; font-size: 1rem; padding: 4px 10px; transition: all 0.15s; }
.date-btn:hover { border-color: var(--accent); }
.date-label { font-size: 0.82rem; font-weight: 600; min-width: 90px; text-align: center; }
.sync-status { font-size: 0.7rem; color: var(--muted); }

/* Layout */
.container { max-width: 560px; margin: 0 auto; padding: 16px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.card-title { font-size: 0.72rem; font-weight: 600; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }

/* Volume summary */
.volume-summary { display: flex; gap: 10px; flex-wrap: wrap; }
.vol-chip { flex: 1; min-width: 90px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
.vol-num { font-size: 1.4rem; font-weight: 800; color: var(--accent2); line-height: 1; }
.vol-unit { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
.vol-label { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }

/* Add exercise form */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.form-row.triple { grid-template-columns: 1fr 1fr 1fr; }
.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field label { font-size: 0.72rem; color: var(--muted); font-weight: 500; }
.form-field input, .form-field select {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 0.88rem; padding: 9px 10px; outline: none;
  transition: border-color 0.2s; width: 100%;
}
.form-field input:focus, .form-field select:focus { border-color: var(--accent); }
.form-field.full { grid-column: 1 / -1; }
.add-btn {
  width: 100%; background: linear-gradient(135deg, #7d9448, #4a5c28);
  border: none; border-radius: 10px; color: #fff; cursor: pointer;
  font-size: 0.9rem; font-weight: 700; padding: 11px; transition: opacity 0.2s, transform 0.1s;
  margin-top: 4px;
}
.add-btn:hover { opacity: 0.9; }
.add-btn:active { transform: scale(0.98); }

/* Quick presets */
.preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.preset-chip {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
  color: var(--muted); cursor: pointer; font-size: 0.75rem; padding: 4px 10px;
  transition: all 0.15s; white-space: nowrap;
}
.preset-chip:hover { border-color: var(--accent); color: var(--accent2); }

/* Exercise log */
.ex-group { margin-bottom: 14px; }
.ex-group-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.ex-name-tag {
  font-size: 0.85rem; font-weight: 700; color: var(--accent2);
  background: rgba(170,185,106,0.12); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 12px;
}
.ex-vol-tag { font-size: 0.75rem; color: var(--muted); }

.set-item {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center;
}
.set-left { display: flex; align-items: center; gap: 12px; }
.set-num { font-size: 0.72rem; color: var(--muted); font-weight: 600; min-width: 28px; }
.set-detail { font-size: 0.88rem; font-weight: 600; }
.set-detail .weight { color: var(--accent2); }
.set-detail .sep { color: var(--muted); margin: 0 4px; }
.set-vol { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
.set-right { display: flex; align-items: center; gap: 6px; }
.set-total { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.set-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 2px 4px; transition: color 0.15s; }
.set-del:hover { color: var(--red); }

.empty-log { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 0; }

/* History */
.hist-item {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  padding: 11px 14px; margin-bottom: 7px; cursor: pointer; transition: border-color 0.15s;
}
.hist-item:hover { border-color: var(--accent); }
.hist-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.hist-date { font-size: 0.85rem; font-weight: 600; }
.hist-vol { font-size: 1rem; font-weight: 800; color: var(--accent2); }
.hist-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.hist-tag {
  font-size: 0.7rem; background: var(--surface3); border: 1px solid var(--border);
  border-radius: 12px; padding: 2px 8px; color: var(--muted);
}

/* Bottom tabs */
.bottom-tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(26,33,20,0.95); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border); display: flex;
}
.bt-btn {
  flex: 1; background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 0.7rem; font-weight: 500; padding: 10px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.15s;
}
.bt-btn .bt-icon { font-size: 1.3rem; line-height: 1; }
.bt-btn.active { color: var(--accent2); }
.bt-btn:hover { color: var(--text); }

.page { display: none; }
.page.show { display: block; }

/* Settings modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  padding: 24px; width: 100%; max-width: 400px;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-title { font-size: 1rem; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.4rem; line-height: 1; }
.settings-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.settings-field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.settings-field input { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.95rem; padding: 10px 14px; outline: none; transition: border-color 0.2s; }
.settings-field input:focus { border-color: var(--accent); }
.save-btn { width: 100%; background: linear-gradient(135deg, #7d9448, #4a5c28); border: none; border-radius: 12px; color: #fff; cursor: pointer; font-size: 0.95rem; font-weight: 700; padding: 13px; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="top-nav">
  <div class="nav-title">💪 운동 트래커</div>
  <div class="date-nav">
    <button class="date-btn" onclick="changeDate(-1)">‹</button>
    <div class="date-label" id="date-label"></div>
    <button class="date-btn" onclick="changeDate(1)">›</button>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="sync-status" id="sync-status"></span>
    <button style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:0.9rem;padding:5px 10px" onclick="openSettings()">⚙️</button>
  </div>
</div>

<div class="container">

  <!-- 오늘 페이지 -->
  <div class="page show" id="page-today">

    <!-- 볼륨 요약 -->
    <div class="card">
      <div class="card-title">오늘의 볼륨</div>
      <div class="volume-summary">
        <div class="vol-chip">
          <div class="vol-num" id="vol-total">0</div>
          <div class="vol-unit">kg</div>
          <div class="vol-label">총 볼륨</div>
        </div>
        <div class="vol-chip">
          <div class="vol-num" id="vol-sets">0</div>
          <div class="vol-unit">세트</div>
          <div class="vol-label">총 세트</div>
        </div>
        <div class="vol-chip">
          <div class="vol-num" id="vol-exercises">0</div>
          <div class="vol-unit">종목</div>
          <div class="vol-label">운동 종목</div>
        </div>
        <div class="vol-chip">
          <div class="vol-num" id="vol-reps">0</div>
          <div class="vol-unit">회</div>
          <div class="vol-label">총 반복</div>
        </div>
      </div>
    </div>

    <!-- 운동 추가 -->
    <div class="card">
      <div class="card-title">운동 추가</div>

      <!-- 빠른 선택 -->
      <div style="font-size:0.72rem;color:var(--muted);margin-bottom:6px">빠른 선택</div>
      <div class="preset-row" id="preset-row"></div>

      <div class="form-row">
        <div class="form-field full">
          <label>운동 이름</label>
          <input type="text" id="ex-name" placeholder="예: 벤치프레스, 스쿼트…" list="exercise-list" autocomplete="off">
          <datalist id="exercise-list"></datalist>
        </div>
      </div>
      <div class="form-row triple">
        <div class="form-field">
          <label>무게 (kg)</label>
          <input type="number" id="ex-weight" placeholder="0" min="0" step="0.5" value="0">
        </div>
        <div class="form-field">
          <label>세트 수</label>
          <input type="number" id="ex-sets" placeholder="3" min="1" max="20" value="3">
        </div>
        <div class="form-field">
          <label>반복 수</label>
          <input type="number" id="ex-reps" placeholder="10" min="1" max="100" value="10">
        </div>
      </div>
      <div id="vol-preview" style="text-align:center;font-size:0.82rem;color:var(--muted);margin-bottom:8px;min-height:20px"></div>
      <button class="add-btn" onclick="addExercise()">+ 추가하기</button>
    </div>

    <!-- 운동 기록 -->
    <div class="card">
      <div class="card-title">운동 기록</div>
      <div id="exercise-log">
        <div class="empty-log">아직 기록된 운동이 없어요 🏋️</div>
      </div>
    </div>
  </div>

  <!-- 히스토리 페이지 -->
  <div class="page" id="page-history">
    <div class="card">
      <div class="card-title">지난 기록</div>
      <div id="history-list">
        <div class="empty-log">아직 기록이 없어요</div>
      </div>
    </div>
  </div>

</div>

<!-- Bottom tabs -->
<div class="bottom-tabs">
  <button class="bt-btn active" onclick="switchPage('today')" id="btb-today">
    <span class="bt-icon">💪</span>오늘
  </button>
  <button class="bt-btn" onclick="switchPage('history')" id="btb-history">
    <span class="bt-icon">📅</span>히스토리
  </button>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal" onclick="closeSettingsOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">⚙️ 설정</div>
      <button class="modal-close" onclick="closeSettings()">×</button>
    </div>
    <div class="settings-field">
      <label>이름 (매크로 트래커와 동일하게 입력)</label>
      <input type="text" id="s-name" placeholder="예: 홍길동">
    </div>
    <button class="save-btn" onclick="saveSettings()">저장</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// Firebase
// ══════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyCuSOXNBb8DXavfGOODxCyaYEvQgj0kRFM",
  authDomain: "allday-pt.firebaseapp.com",
  projectId: "allday-pt",
  storageBucket: "allday-pt.firebasestorage.app",
  messagingSenderId: "82337265547",
  appId: "1:82337265547:web:2b43cacce5fe8df607218e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── 로그인 체크
(function() {
  try {
    const u = JSON.parse(localStorage.getItem('allday-user') || 'null');
    if (!u) location.replace('login.html?redirect=' + encodeURIComponent(location.pathname.split('/').pop()));
  } catch(e) { location.replace('login.html'); }
})();

function getMemberId() {
  try {
    const u = JSON.parse(localStorage.getItem('allday-user') || 'null');
    if (u && u.id) return u.id;
  } catch(e) {}
  let id = localStorage.getItem('mt-member-id');
  if (!id) { id = 'member_' + Date.now(); localStorage.setItem('mt-member-id', id); }
  return id;
}
function getMemberName() {
  try {
    const u = JSON.parse(localStorage.getItem('allday-user') || 'null');
    return u ? u.name : null;
  } catch(e) { return null; }
}

function setSyncStatus(status) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (status === 'syncing') { el.textContent = '☁️ 동기화 중…'; el.style.color = 'var(--muted)'; }
  else if (status === 'ok') { el.textContent = '✅ 동기화됨'; el.style.color = 'var(--green)'; setTimeout(() => { el.textContent = ''; }, 3000); }
  else if (status === 'error') { el.textContent = '⚠️ 오프라인'; el.style.color = 'var(--yellow)'; }
  else { el.textContent = ''; }
}

async function syncWorkoutToFirestore(date) {
  const s = getSettings();
  const loginName = getMemberName();
  if (!s.memberName && loginName) s.memberName = loginName;
  if (!s.memberName) return;
  const memberId = getMemberId();
  const log = getDayLog(date);
  setSyncStatus('syncing');
  try {
    const totalVol = log.reduce((a,b) => a + (b.weight * b.sets * b.reps), 0);
    await db.collection('members').doc(memberId).set({
      name: s.memberName,
      lastSync: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge: true});

    await db.collection('members').doc(memberId)
      .collection('workouts').doc(date).set({
        date,
        exercises: log,
        totalVolume: Math.round(totalVol),
        totalSets: log.reduce((a,b) => a + b.sets, 0),
        totalReps: log.reduce((a,b) => a + b.sets * b.reps, 0),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    setSyncStatus('ok');
  } catch(e) {
    console.error('운동 동기화 오류:', e);
    setSyncStatus('error');
  }
}

// ══════════════════════════════════════════════
// 운동 프리셋 DB
// ══════════════════════════════════════════════
const EXERCISE_PRESETS = [
  // 가슴
  '벤치프레스', '인클라인 벤치프레스', '덤벨 플라이', '딥스', '푸시업',
  // 등
  '데드리프트', '바벨 로우', '풀업', '랫풀다운', '시티드 케이블 로우', '원암 덤벨 로우',
  // 어깨
  '오버헤드 프레스', '사이드 레터럴 레이즈', '프론트 레이즈', '페이스 풀',
  // 하체
  '스쿼트', '레그 프레스', '런지', '레그 컬', '레그 익스텐션', '카프 레이즈', '힙 쓰러스트',
  // 팔
  '바벨 컬', '해머 컬', '트라이셉스 푸시다운', '스컬 크러셔', '딥스',
  // 복근
  '플랭크', '크런치', '레그 레이즈', 'AB휠',
  // 유산소
  '런닝머신', '자전거', '로잉머신',
];

const QUICK_PRESETS = ['벤치프레스','스쿼트','데드리프트','오버헤드 프레스','풀업','바벨 로우'];

// ══════════════════════════════════════════════
// State
// ══════════════════════════════════════════════
let currentDate = todayStr();
let currentPage = 'today';

function todayStr() { return new Date().toISOString().slice(0, 10); }

function getSettings() {
  return JSON.parse(localStorage.getItem('wt-settings') || '{"memberName":""}');
}
function saveSettingsData(d) { localStorage.setItem('wt-settings', JSON.stringify(d)); }

function getDayLog(date) {
  return JSON.parse(localStorage.getItem('wt-log-' + date) || '[]');
}
function saveDayLog(date, log) {
  localStorage.setItem('wt-log-' + date, JSON.stringify(log));
  syncWorkoutToFirestore(date);
}

function getAllDates() {
  const dates = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('wt-log-')) dates.push(key.replace('wt-log-', ''));
  }
  return dates.sort((a, b) => b.localeCompare(a));
}

// ══════════════════════════════════════════════
// Date nav
// ══════════════════════════════════════════════
function changeDate(delta) {
  const d = new Date(currentDate);
  d.setDate(d.getDate() + delta);
  const next = d.toISOString().slice(0, 10);
  if (next > todayStr()) return;
  currentDate = next;
  renderDateLabel();
  renderLog();
  renderSummary();
}

function renderDateLabel() {
  const d = new Date(currentDate + 'T00:00:00');
  const today = todayStr();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const ystStr = yest.toISOString().slice(0, 10);
  let label;
  if (currentDate === today) label = '오늘';
  else if (currentDate === ystStr) label = '어제';
  else label = `${d.getMonth()+1}/${d.getDate()}`;
  document.getElementById('date-label').textContent = label;
}

// ══════════════════════════════════════════════
// Summary
// ══════════════════════════════════════════════
function renderSummary() {
  const log = getDayLog(currentDate);
  const totalVol = log.reduce((a, b) => a + (b.weight * b.sets * b.reps), 0);
  const totalSets = log.reduce((a, b) => a + b.sets, 0);
  const totalReps = log.reduce((a, b) => a + b.sets * b.reps, 0);
  const uniqueEx = new Set(log.map(e => e.name)).size;

  document.getElementById('vol-total').textContent = Math.round(totalVol).toLocaleString();
  document.getElementById('vol-sets').textContent = totalSets;
  document.getElementById('vol-exercises').textContent = uniqueEx;
  document.getElementById('vol-reps').textContent = totalReps;
}

// ══════════════════════════════════════════════
// Volume preview
// ══════════════════════════════════════════════
function updateVolPreview() {
  const w = parseFloat(document.getElementById('ex-weight').value) || 0;
  const s = parseInt(document.getElementById('ex-sets').value) || 0;
  const r = parseInt(document.getElementById('ex-reps').value) || 0;
  const el = document.getElementById('vol-preview');
  if (w > 0 && s > 0 && r > 0) {
    el.innerHTML = `<span style="color:var(--accent2);font-weight:700">${(w * s * r).toLocaleString()} kg</span> 볼륨`;
  } else {
    el.textContent = '';
  }
}

['ex-weight','ex-sets','ex-reps'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateVolPreview);
});

// ══════════════════════════════════════════════
// Log render
// ══════════════════════════════════════════════
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const COLORS = ['#aab96a','#7a9e8a','#c8a84a','#c47a50','#6b9e4a','#d4c87a','#8ab860'];
function exColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
  return COLORS[Math.abs(h) % COLORS.length];
}

function renderLog() {
  const log = getDayLog(currentDate);
  const el = document.getElementById('exercise-log');
  if (log.length === 0) {
    el.innerHTML = '<div class="empty-log">아직 기록된 운동이 없어요 🏋️</div>';
    return;
  }
  // Group by exercise name
  const groups = {};
  log.forEach(item => {
    if (!groups[item.name]) groups[item.name] = [];
    groups[item.name].push(item);
  });

  let html = '';
  Object.entries(groups).forEach(([name, items]) => {
    const totalVol = items.reduce((a, b) => a + b.weight * b.sets * b.reps, 0);
    const color = exColor(name);
    html += `<div class="ex-group">
      <div class="ex-group-header">
        <span class="ex-name-tag" style="color:${color};border-color:${color}40;background:${color}12">${esc(name)}</span>
        <span class="ex-vol-tag">볼륨 ${Math.round(totalVol).toLocaleString()} kg</span>
      </div>`;
    let setCounter = 1;
    items.forEach(item => {
      for (let s = 1; s <= item.sets; s++) {
        html += `<div class="set-item">
          <div class="set-left">
            <span class="set-num">SET ${setCounter++}</span>
            <div>
              <div class="set-detail">
                <span class="weight">${item.weight}kg</span>
                <span class="sep">×</span>
                ${item.reps}회
                ${item.sets > 1 ? `<span style="color:var(--muted);font-size:0.75rem"> (${item.sets}세트)</span>` : ''}
              </div>
              <div class="set-vol">${(item.weight * item.sets * item.reps).toLocaleString()} kg 볼륨</div>
            </div>
          </div>
          <div class="set-right">
            <button class="set-del" onclick="deleteEntry('${item.id}')">✕</button>
          </div>
        </div>`;
        break; // 항목당 1개 행 (sets는 같이 표시)
      }
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

// ══════════════════════════════════════════════
// Add / Delete
// ══════════════════════════════════════════════
function addExercise() {
  const name = document.getElementById('ex-name').value.trim();
  const weight = parseFloat(document.getElementById('ex-weight').value);
  const sets = parseInt(document.getElementById('ex-sets').value);
  const reps = parseInt(document.getElementById('ex-reps').value);

  if (!name) { alert('운동 이름을 입력해주세요!'); return; }
  if (isNaN(weight) || weight < 0) { alert('무게를 입력해주세요! (맨몸운동은 0 입력)'); return; }
  if (isNaN(sets) || sets < 1) { alert('세트 수를 입력해주세요!'); return; }
  if (isNaN(reps) || reps < 1) { alert('반복 수를 입력해주세요!'); return; }

  const log = getDayLog(currentDate);
  log.push({
    id: Date.now() + Math.random().toString(36).slice(2),
    name, weight, sets, reps,
    volume: weight * sets * reps
  });
  saveDayLog(currentDate, log);

  // 운동 이름 기억
  rememberExercise(name);

  // 폼 초기화 (이름은 유지)
  document.getElementById('ex-weight').value = '';
  document.getElementById('vol-preview').textContent = '';

  renderLog();
  renderSummary();
  updateDatalist();
  updatePresets();
}

function deleteEntry(id) {
  let log = getDayLog(currentDate);
  log = log.filter(i => i.id !== id);
  saveDayLog(currentDate, log);
  renderLog();
  renderSummary();
}

// ══════════════════════════════════════════════
// Recent exercises memory
// ══════════════════════════════════════════════
function getRecentExercises() {
  return JSON.parse(localStorage.getItem('wt-recent-ex') || '[]');
}
function rememberExercise(name) {
  let list = getRecentExercises().filter(n => n !== name);
  list.unshift(name);
  list = list.slice(0, 20);
  localStorage.setItem('wt-recent-ex', JSON.stringify(list));
}

function updateDatalist() {
  const all = [...new Set([...getRecentExercises(), ...EXERCISE_PRESETS])];
  document.getElementById('exercise-list').innerHTML = all.map(n => `<option value="${esc(n)}">`).join('');
}

function updatePresets() {
  const recent = getRecentExercises().slice(0, 4);
  const show = [...new Set([...recent, ...QUICK_PRESETS])].slice(0, 8);
  document.getElementById('preset-row').innerHTML = show.map(name =>
    `<div class="preset-chip" onclick="selectPreset('${esc(name)}')">${esc(name)}</div>`
  ).join('');
}

function selectPreset(name) {
  document.getElementById('ex-name').value = name;
  document.getElementById('ex-weight').focus();
}

// ══════════════════════════════════════════════
// History
// ══════════════════════════════════════════════
function renderHistory() {
  const dates = getAllDates();
  const el = document.getElementById('history-list');
  if (dates.length === 0) { el.innerHTML = '<div class="empty-log">아직 기록이 없어요</div>'; return; }
  el.innerHTML = dates.slice(0, 30).map(date => {
    const log = getDayLog(date);
    if (log.length === 0) return '';
    const totalVol = log.reduce((a, b) => a + b.weight * b.sets * b.reps, 0);
    const totalSets = log.reduce((a, b) => a + b.sets, 0);
    const names = [...new Set(log.map(e => e.name))];
    const d = new Date(date + 'T00:00:00');
    const label = date === todayStr() ? '오늘' : `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
    return `<div class="hist-item" onclick="jumpToDate('${date}')">
      <div class="hist-top">
        <div class="hist-date">${label}</div>
        <div class="hist-vol">${Math.round(totalVol).toLocaleString()} kg</div>
      </div>
      <div class="hist-tags">
        <span class="hist-tag">세트 ${totalSets}</span>
        ${names.map(n => `<span class="hist-tag">${esc(n)}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function jumpToDate(date) {
  currentDate = date;
  renderDateLabel();
  renderLog();
  renderSummary();
  switchPage('today');
}

// ══════════════════════════════════════════════
// Page switch
// ══════════════════════════════════════════════
function switchPage(p) {
  currentPage = p;
  document.querySelectorAll('.page').forEach(el => el.classList.remove('show'));
  document.getElementById('page-' + p).classList.add('show');
  document.querySelectorAll('.bt-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('btb-' + p).classList.add('active');
  if (p === 'history') renderHistory();
}

// ══════════════════════════════════════════════
// Settings
// ══════════════════════════════════════════════
function openSettings() {
  const s = getSettings();
  // 매크로 트래커 이름도 같이 체크
  const mtSettings = JSON.parse(localStorage.getItem('mt-settings') || '{}');
  document.getElementById('s-name').value = s.memberName || mtSettings.memberName || '';
  document.getElementById('settings-modal').classList.add('show');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); }
function closeSettingsOutside(e) { if (e.target === document.getElementById('settings-modal')) closeSettings(); }

function saveSettings() {
  const name = document.getElementById('s-name').value.trim();
  saveSettingsData({ memberName: name });
  // 매크로 트래커 settings에도 동기화
  const mtSettings = JSON.parse(localStorage.getItem('mt-settings') || '{}');
  if (name) { mtSettings.memberName = name; localStorage.setItem('mt-settings', JSON.stringify(mtSettings)); }
  closeSettings();
  alert(name ? `✅ "${name}"으로 저장됐어요!` : '이름을 입력해주세요.');
}

// ══════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════
renderDateLabel();
renderSummary();
renderLog();
updateDatalist();
updatePresets();
</script>
